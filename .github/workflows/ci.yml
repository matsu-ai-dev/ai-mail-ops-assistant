name: CI

on:
  push:                 # push されたら必ず実行
    branches: [ main ]  # main ブランチだけで十分ならここを main
  pull_request:         # PR でも回したいなら残す
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # ---- Python テスト ----
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -r requirements.txt
    - run: pytest -q

    # ---- Docker ビルドのみ（push しない）----
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v5
      with:
        push: false
        tags: vision-desc:ci
